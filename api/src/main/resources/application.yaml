spring:
  application:
    name: api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/convertly}
    username: ${DB_USER:convertly-user}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  mvc:
    problemdetails:
      enabled: true

convertly:
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    bucket: convertly
    access-key: ${RUSTFS_ACCESS_KEY}
    secret-key: ${RUSTFS_SECRET_KEY}
